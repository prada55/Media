# Yako — lints stricts very_good_analysis.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "build/**"
    - "test/**/generated/**"
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Application (pas un package publié) : la doc est exigée sur les
    # contrats (interfaces, services), pas sur chaque membre public.
    public_member_api_docs: false
    # Syntaxe `new(...)` (Dart 3.13) : on garde la forme classique
    # `ClassName(...)`, plus lisible pour les contributeurs.
    unnecessary_type_name_in_constructor: false
