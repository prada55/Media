# .github/workflows/pr_check.yml — Yako : analyse + tests sur chaque PR.
name: PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter --disable-analytics && dart --disable-analytics
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze --fatal-infos
      - run: flutter test
