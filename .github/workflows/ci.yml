# .github/workflows/ci.yml — Yako
# analyze-and-test sur chaque push ; build Android release (obfusqué) sur
# main uniquement. Build iOS préparé mais commenté (runner macOS payant).
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter --disable-analytics && dart --disable-analytics
      - name: Dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit & widget tests (+ coverage)
        run: flutter test --coverage
      - name: Permissions audit (sources)
        run: scripts/audit_permissions.sh
      - name: Security audit (logs, secrets, outdated)
        run: scripts/audit_security.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
      - name: Build APK (obfuscated, split per ABI)
        env:
          YAKO_CONFIG_HMAC_KEY: ${{ secrets.YAKO_CONFIG_HMAC_KEY }}
        run: |
          flutter pub get
          dart run build_runner build
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=YAKO_CONFIG_HMAC_KEY="${YAKO_CONFIG_HMAC_KEY:-yako-dev-config-hmac-key-change-me}"
      - name: Check APK size (< 60 MB per ABI)
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$apk")
            echo "$apk: $((size / 1024 / 1024)) MB"
            test "$size" -lt $((60 * 1024 * 1024)) || { echo "APK too large"; exit 1; }
          done
      - name: Permissions audit (binary)
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          export PATH="$(dirname "$AAPT"):$PATH"
          scripts/audit_permissions.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/symbols
          retention-days: 14

