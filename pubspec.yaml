# Yako — Phase 1 : socle technique
#
# Comptabilité vocale 100 % hors ligne pour commerçants du secteur informel
# (Côte d'Ivoire). Versions vérifiées sur l'API pub.dev le 2026-10-20.
# Aucune dépendance Firebase / BaaS / analytics / crash reporting cloud.

name: yako
description: "Yako — comptabilité vocale hors ligne pour commerçants."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  # SHA-256 / HMAC (signature config, empreintes).
  crypto: ^3.0.7
  # AES-256-GCM + PBKDF2 (pointycastle exclu : > 12 mois sans publication).
  cryptography: ^2.9.0
  # ORM SQLite typé + migrations.
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # État applicatif (Notifier, pas de StateProvider legacy).
  flutter_riverpod: ^3.4.3
  # Keychain iOS / Keystore Android.
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3
  # Exception documentée à la règle des 12 mois (docs/roadmap.md).
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # Binaires SQLite via build hooks ; SQLCipher sélectionné plus bas.
  # Remplace sqlcipher_flutter_libs / sqlite3_flutter_libs (EOL).
  permission_handler: ^13.0.2
  record: ^7.1.2
  sqlite3: ^3.7.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: 2.16.1 # 2.16.2+ incompatible avec injectable_generator (analyzer)
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

# Binaires téléchargés AU BUILD (sha256 vérifié), jamais à l'exécution.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/i18n/

  # Polices préparées (Phase 6 / branding) — décommenter une fois les
  # fichiers ajoutés dans assets/fonts/.
  # fonts:
  #   - family: Yako
  #     fonts:
  #       - asset: assets/fonts/Yako-Regular.ttf
  #       - asset: assets/fonts/Yako-Bold.ttf
  #         weight: 700
