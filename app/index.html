<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moteur">
  <meta name="theme-color" content="#0b0b10">
  <meta name="description" content="Moteur Motion — studio de motion design et d'animation sur iPhone : calques, keyframes, texte animé, export vidéo.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <title>Moteur Motion</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btnProjects" class="ib" aria-label="Projets">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button id="projTitle" class="title" aria-label="Réglages de la composition">
        <span id="projName">Sans titre</span>
        <small id="projMeta">1080×1920 · 30 i/s</small>
      </button>
      <div class="sp"></div>
      <button id="btnUndo" class="ib" aria-label="Annuler">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="btnRedo" class="ib" aria-label="Rétablir">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button id="btnExport" class="pill">Exporter</button>
    </header>

    <main class="viewer" id="viewer">
      <canvas id="stage"></canvas>
    </main>

    <div class="transport">
      <button id="btnStart" class="ib" aria-label="Début">
        <svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 6-8 6 8 6z" class="f"/></svg>
      </button>
      <button id="btnPrevKey" class="ib" aria-label="Keyframe précédente">
        <svg viewBox="0 0 24 24"><path d="m9 6-6 6 6 6"/><path d="m16 7 5 5-5 5-5-5z" class="f"/></svg>
      </button>
      <button id="btnPlay" class="play" aria-label="Lecture">
        <svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4.5v15l13-7.5z" class="f"/></svg>
      </button>
      <button id="btnNextKey" class="ib" aria-label="Keyframe suivante">
        <svg viewBox="0 0 24 24"><path d="m15 6 6 6-6 6"/><path d="m8 7 5 5-5 5-5-5z" class="f"/></svg>
      </button>
      <button id="btnLoop" class="ib on" aria-label="Boucle">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      </button>
      <div class="time"><span id="timeLabel">0:00.00</span><small id="frameLabel">i 0</small></div>
    </div>

    <section class="panel" id="panel">
      <div class="pane" data-pane="timeline" id="paneTimeline"></div>
      <div class="pane" data-pane="props" id="paneProps"></div>
      <div class="pane" data-pane="animate" id="paneAnimate"></div>
      <div class="pane" data-pane="add" id="paneAdd"></div>
    </section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="timeline" class="on">
        <svg viewBox="0 0 24 24"><path d="M3 6h10M3 12h18M3 18h7"/><path d="M16 3v6M20 15v6"/></svg>
        <span>Timeline</span>
      </button>
      <button data-tab="props">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>Propriétés</span>
      </button>
      <button data-tab="animate">
        <svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 1-4.5 4.5L18 21l-6-3-6 3 1.5-6.5L3 10l6-1z"/></svg>
        <span>Animer</span>
      </button>
      <button data-tab="add">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Ajouter</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileVideo" accept="video/*" hidden>
  <input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>
  <input type="file" id="fileProject" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
